<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>킥플립 팬사이트</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div id="wrap">
    <div id="game">
      <canvas id="stage" width="960" height="540"></canvas>

      <!-- 화면 위 표시 (게임 화면을 가리지 않도록 작게) -->
      <div id="hud-map-name"></div>
      <div id="hud-toast"></div>
      <div id="hud-music" hidden>♪</div> <!-- 음악 재생 표시 자리 (음악 단계에서 사용) -->

      <!-- 앨범 맵에서 메인 골목으로 돌아가기 -->
      <button id="btn-back" hidden>골목으로 돌아가기</button>

      <!-- 개발용 맵 선택 (CONFIG.debug가 true일 때만 보임) -->
      <select id="dev-map" hidden title="개발용 맵 이동"></select>

      <!-- 모바일 터치 이동 버튼 -->
      <div id="touch-controls">
        <button id="btn-left" aria-label="왼쪽으로 이동">◀</button>
        <button id="btn-right" aria-label="오른쪽으로 이동">▶</button>
      </div>

      <!-- 앨범 맵 끝에 닿으면 뜨는 "메인 골목으로 돌아가기" 팝업 -->
      <div id="confirm" hidden>
        <div id="confirm-box">
          <div id="confirm-text">이 앨범의 끝이에요.<br>메인 골목으로 돌아갈까요?</div>
          <div id="confirm-buttons">
            <button id="confirm-yes">메인으로 돌아가기</button>
            <button id="confirm-no">더 둘러보기</button>
          </div>
        </div>
      </div>

      <!-- 임시 사건 팝업 (7단계에서 공통 컴포넌트로 완성) -->
      <div id="popup" hidden>
        <div id="popup-box">
          <div id="popup-title"></div>
          <div id="popup-date"></div>
          <div id="popup-body">임시 팝업입니다. 설명, 사진, 멤버별 스케이트보드는 다음 단계에서 들어갑니다.</div>
          <div id="popup-source"></div>
          <button id="popup-close">닫기</button>
        </div>
      </div>
    </div>

    <div id="rotate-hint">가로 화면으로 돌려서 플레이해 주세요</div>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/events-data.js"></script>
  <script src="js/music-data.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
